<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ERASKYE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Бастапқы кнопка тұратын жер */
        #start-screen {
            position: absolute;
            z-index: 10;
            transition: opacity 1s ease;
        }

        .btn {
            background-color: transparent;
            color: #ff0044;
            border: 2px solid #ff0044;
            padding: 18px 50px;
            font-size: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            border-radius: 40px;
            text-transform: uppercase;
            box-shadow: 0 0 25px rgba(255, 0, 68, 0.6);
            -webkit-tap-highlight-color: transparent;
            animation: pulseBtn 2s infinite;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 0, 68, 0.6); }
            50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(255, 0, 68, 1); }
            100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 0, 68, 0.6); }
        }

        .btn:active {
            transform: scale(0.95);
        }

        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
    </style>
</head>
<body>

    <!-- ERASKYE кнопкасы -->
    <div id="start-screen">
        <button class="btn" onclick="startHeart()">ERASKYE</button>
    </div>

    <!-- Жүрек салынатын Canvas -->
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        
        let width, height, centerX, centerY;
        let points = [];
        let frame = 0;
        let isStarted = false;

        // Экран өлшемін реттеу
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
            if (isStarted) generateHeart();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Жүрек нүктелерін жасау
        function generateHeart() {
            points = [];
            const scale = Math.min(width, height) / 45; 
            
            // Жүрек формуласы
            for (let t = 0; t < Math.PI * 2; t += 0.15) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                
                for (let r = 0.1; r < 1.0; r += 0.25) {
                    points.push({
                        x: centerX + x * scale * r,
                        y: centerY + y * scale * r,
                        opacity: 0,
                        delay: Math.random() * 80 // Жайлап пайда болу үшін
                    });
                }
            }
        }

        // ERASKYE кнопкасы басылғанда
        function startHeart() {
            isStarted = true;
            
            // Кнопканы жасыру
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.style.display = 'none', 1000);
            
            // Canvas-ты көрсету
            canvas.style.opacity = '1';
            
            // Жүрек нүктелерін жасау
            generateHeart();
            
            // Анимацияны бастау
            animate();
        }

        // Анимация циклі
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);
            frame++;
            
            // Жүректің соғу эффектісі
            const pulse = 1 + Math.sin(frame * 0.05) * 0.03;

            // Қаріп өлшемі
            const fontSize = Math.max(8, Math.min(width, height) * 0.018);
            ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "#ff0044";
            ctx.shadowBlur = 10;

            points.forEach(p => {
                if (frame > p.delay) {
                    p.opacity += 0.02;
                    if (p.opacity > 1) p.opacity = 1;
                }

                if (p.opacity > 0) {
                    const dx = p.x - centerX;
                    const dy = p.y - centerY;
                    const px = centerX + dx * pulse;
                    const py = centerY + dy * pulse;

                    ctx.fillStyle = `rgba(255, 0, 68, ${p.opacity})`;
                    ctx.fillText("I love you", px, py);
                }
            });
        }
    </script>
</body>
</html>
