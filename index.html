<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I Love You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Қараңғы фон */
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }

        #start-screen {
            position: absolute;
            text-align: center;
            z-index: 10;
            transition: opacity 1s ease;
        }

        .btn {
            background-color: transparent;
            color: #ff0044;
            border: 2px solid #ff0044;
            padding: 15px 40px;
            font-size: 18px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 68, 0.5);
            -webkit-tap-highlight-color: transparent;
            animation: pulseBtn 2s infinite;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 68, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 0, 68, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 68, 0.5); }
        }

        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
    </style>
</head>
<body>

    <!-- Бастау батырмасы -->
    <div id="start-screen">
        <button class="btn" onclick="showHeart()">Ашу</button>
    </div>

    <!-- Жүрек салынатын Canvas -->
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        
        let width, height, centerX, centerY;
        let isAnimating = false;
        let time = 0;

        // Экран өлшемін реттеу
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Жүрек нүктелерін жасау
        function generateHeartPoints() {
            const points = [];
            // Экранға сыйымды болуы үшін масштаб
            const scale = Math.min(width, height) / 42; 
            
            // Жүрек формуласы
            for (let t = 0; t < Math.PI * 2; t += 0.12) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                
                // Жүректің ішін толтыру
                for (let r = 0.15; r < 1.1; r += 0.22) {
                    points.push({
                        x: centerX + x * scale * r,
                        y: centerY + y * scale * r
                    });
                }
            }
            return points;
        }

        let heartPoints = [];

        // Батырма басылғанда жүректі көрсету
        function showHeart() {
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.style.display = 'none', 1000);
            
            canvas.style.opacity = '1';
            heartPoints = generateHeartPoints();
            
            if (!isAnimating) {
                isAnimating = true;
                animate();
            }
        }

        // Анимация циклі (Тек қызыл түс, тыныш соғу)
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);
            
            time += 0.05;
            // Жүректің соғу эффектісі (Pulse)
            const pulse = 1 + Math.sin(time) * 0.03;

            // Қаріп өлшемі (экранға қарай бейімделеді)
            const fontSize = Math.max(8, Math.min(width, height) * 0.018);

            ctx.font = `bold ${fontSize}px 'Courier New', monospace`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            // Қызыл түс және жарқырау эффектісі
            ctx.fillStyle = "#ff0044";
            ctx.shadowColor = "#ff0044";
            ctx.shadowBlur = 10;

            heartPoints.forEach(p => {
                // Нүктелерді орталықтан соғу үшін есептеу
                const dx = p.x - centerX;
                const dy = p.y - centerY;
                const px = centerX + dx * pulse;
                const py = centerY + dy * pulse;

                ctx.fillText("I love you", px, py);
            });
        }
    </script>
</body>
</html>
