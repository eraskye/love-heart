<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do you love me?</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'VT323', monospace;
            user-select: none;
        }

        body {
            background-color: #0d0d0d;
            color: white;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 1-ші экран: Сұрақ терезесі --- */
        #dialog-box {
            background-color: #111;
            border: 4px double #fff;
            padding: 10px;
            width: 400px;
            max-width: 90%;
            position: absolute;
            z-index: 100;
            box-shadow: 10px 10px 0px rgba(255, 255, 255, 0.2);
        }

        .dialog-header {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            border-bottom: 2px solid #fff;
            padding-bottom: 5px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border: 2px solid #fff;
        }

        .dialog-content {
            text-align: center;
            padding: 20px 0;
        }

        .dialog-content p {
            font-size: 32px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }

        button {
            background: transparent;
            color: white;
            border: 3px solid white;
            padding: 5px 25px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'VT323', monospace;
        }

        button:hover {
            background: white;
            color: black;
        }

        #no-btn {
            position: absolute;
            left: 60%;
        }

        /* --- 2-ші экран: Махаббат жаңбыры --- */
        #love-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d0d;
            overflow: hidden;
        }

        .falling-text {
            position: absolute;
            top: -100px;
            color: #ff00aa;
            font-size: 28px;
            white-space: nowrap;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(110vh); }
        }

        .center-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            animation: pulse 2s infinite;
        }

        .center-content h1 {
            font-size: 80px;
            color: white;
            text-shadow: 0 0 20px #ff00aa, 0 0 40px #ff00aa;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }

        .heart {
            width: 100px;
            height: 100px;
            background: white;
            position: relative;
            transform: rotate(-45deg);
            margin: 0 auto;
            box-shadow: 0 0 30px #ff00aa, 0 0 60px #ff00aa;
            animation: heartbeat 1s infinite alternate;
        }

        .heart::before, .heart::after {
            content: "";
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 30px #ff00aa;
        }

        .heart::before {
            top: -50px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 50px;
        }

        @keyframes heartbeat {
            0% { transform: rotate(-45deg) scale(1); }
            100% { transform: rotate(-45deg) scale(1.1); }
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.02); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <!-- Бірінші экран -->
    <div id="dialog-box">
        <div class="dialog-header">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        <div class="dialog-content">
            <p>Do you love me?</p>
            <div class="buttons">
                <button id="yes-btn" onclick="showLove()">Yes</button>
                <button id="no-btn" onmouseover="moveNo()">No</button>
            </div>
        </div>
    </div>

    <!-- Екінші экран -->
    <div id="love-screen">
        <div id="matrix"></div>
        <div class="center-content">
            <h1>LOVE YOU</h1>
            <div class="heart"></div>
        </div>
    </div>

    <script>
        // "No" батырмасын тышқаннан қашыру
        function moveNo() {
            const noBtn = document.getElementById('no-btn');
            const randomX = Math.floor(Math.random() * 80) - 40; // -40px-тен +40px-ке дейін
            const randomY = Math.floor(Math.random() * 80) - 40; // -40px-тен +40px-ке дейін
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            
            // Кейде мәтінін де өзгертіп қоюға болады
            const texts = ["No", "Are you sure?", "Really?", "Think again!", "Please?"];
            noBtn.innerText = texts[Math.floor(Math.random() * texts.length)];
        }

        // "Yes" басқандағы әрекет
        function showLove() {
            // Бірінші экранды жасыру
            document.getElementById('dialog-box').style.display = 'none';
            
            // Екінші экранды көрсету
            document.getElementById('love-screen').style.display = 'block';
            
            // Махаббат жаңбырын бастау
            startMatrix();
        }

        // Төмен қарай түсетін "LOVE YOU" мәтіндерін жасау
        function startMatrix() {
            const matrixContainer = document.getElementById('matrix');
            const text = "LOVE YOU ";
            
            // 60 баған жасаймыз
            for (let i = 0; i < 60; i++) {
                const span = document.createElement('span');
                span.className = 'falling-text';
                span.innerText = text;
                
                // Кездейсоқ позициялар
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDuration = (Math.random() * 3 + 2) + 's'; // 2-5 секунд
                span.style.animationDelay = Math.random() * 5 + 's'; // 0-5 секунд кідіріс
                span.style.fontSize = (Math.random() * 20 + 20) + 'px'; // 20-40px өлшем
                
                matrixContainer.appendChild(span);
            }
        }
    </script>
</body>
</html>
